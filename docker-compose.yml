services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: santa
      POSTGRES_PASSWORD: santa
      POSTGRES_DB: santa
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U santa -d santa"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
